[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolctl-sdk-python"
version = "0.1.0"
description = "Python SDK for registering tool metadata and handlers."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["toolctl*"]
